[project]
name = "dayz-agentic-modding-mcp"
version = "0.1.0"
description = "MCP server for agentic DayZ mod development: build, run, verdict"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["mcp==1.29.0", "anyio>=4.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The virtual gamepad (src/dayz_mcp/gamepad.py). Optional on purpose: it is the
# only part of this server that depends on a kernel driver being installed
# (ViGEmBus, a machine-owner act), and it is imported lazily so a machine
# without it still runs every other tool -- and still gets a refusal with
# installation instructions instead of a traceback.
client = ["vgamepad>=0.1.0; sys_platform == 'win32'"]

[project.scripts]
dayz-mcp = "dayz_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dayz_mcp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # A test that runs a real external tool (DayZ Tools, Blender) or indexes a
    # whole real corpus (the unpacked vanilla scripts, a folder of installed
    # mods). These are the tests that prove the readers against reality rather
    # than against fixtures, and they are also the only ones that take
    # minutes: the whole set is about twelve on this machine, against about
    # two for everything else. So they are OUT of the default run and are one
    # command away -- `pytest -m corpus` -- rather than being left to skip
    # silently forever. See the README's "corpus tests" section, and
    # tests/samples.local.example.toml for what they need pointed at.
    "corpus: runs a real external tool or indexes a real corpus (minutes)",
]
addopts = "-m 'not corpus'"
filterwarnings = [
    # Raised by mcp==1.29.0's own internal Settings model the moment FastMCP()
    # is constructed (pydantic_settings/sources/utils.py, unrelated to any of
    # our code); harmless, and narrowly targeted by class rather than blanket
    # -suppressed so a real warning from our own code still surfaces.
    "ignore::pydantic_settings.exceptions.IncompleteFieldDefinitionWarning",
]
