[project]
name = "dayz-agentic-modding-mcp"
version = "0.1.0"
description = "MCP server for agentic DayZ mod development: build, run, verdict"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["mcp==1.29.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dayz-mcp = "dayz_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
