# Portable half of the profile. Copy to dayz-mcp.toml in your mod repository.
# Nothing here may point at a specific machine.
#
# Machine-specific settings go in dayz-mcp.local.toml instead (never
# committed), for example:
#   [machine]
#   config = "serverDZ.cfg"  # the server config file inside stand_root
#
# To let the stand load the bridge mod (bridge_build packs it from this
# server's own repository, and prints this path in its job summary), the same
# local file carries:
#   [mods]
#   extra       = ["<path to the mcp server>/@DZMCP_Bridge"]
#   server_only = ["@DZMCP_Bridge"]   # routes it to -serverMod, not -mod
# Attaching it is deliberately opt-in: the bridge is one more pbo in the stand,
# and a run without it has to stay possible.

[project]
name = "my-mod"

[build]
# One name per mod. Source lives in <root>/MyMod, the pbo becomes MyMod.pbo and
# the built mod folder is @MyMod. Declared once so the three cannot drift apart.
mods = ["MyMod"]
# Optional: run before packing, for projects that generate code first.
pre_script = ""
# Optional: mod_build refuses to pack a source folder containing any of these
# (FileBank packs the whole folder, so they would otherwise ship inside the
# pbo). Listing the key REPLACES the default wholesale, so leave it out unless
# you mean to change it -- narrowing it by accident is how something ends up
# inside a published pbo. The default is:
# exclude = [".git", "*.blend", "*.blend1", ".gitignore", ".gitattributes", "README.md", "*.ps1"]
# Optional: where a mod's source actually lives, if not the default
# <root>/<name>. "." means the mod's config.cpp sits at the repository root
# itself, next to this file -- a common layout this key exists to support.
# A mod absent here just uses the default; nothing changes for it.
# [build.sources]
# MyMod = "."
# Optional: pack a filtered copy instead of refusing when `exclude` finds
# something. Needed for a mod whose source is the repository root (it always
# contains at least .git) -- off by default because copying a tree safely
# requires the stale-pbo check below to measure the ORIGINAL source, which
# only this server's own packer.py can guarantee.
stage = false

[expect]
# The line your mod prints when it has finished loading. The server does not
# know it -- you declare it.
ready_line   = "MyMod loaded"
max_warnings = 0
forbid       = ["Bad type", "Can't compile", "NULL pointer to instance"]
# Regexes marking script errors that belong to you, used by the client compile
# check. Example: "SCRIPT\\s+\\(E\\).*MyPrefix_"
error_regex  = []
# Extra engine noise to ignore, on top of the built-in list.
noise        = []

# Any key=value pairs your ready line carries. The server does not know these
# names; it parses whatever it finds and compares with what you declare here.
[expect.counters]
items   = 12
recipes = 3
